plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

repositories {
	// Loom adds the Fabric, Mojang and Maven Central repositories automatically.
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
	def props = ["version": project.version]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

// Jar file names always carry the mod name, mod version, and Minecraft
// version, e.g. serverpassword-1.3.0+1.21.11.jar - the fabric.mod.json
// version above stays just the mod's own version.
def jarVersion = "${project.version}+${minecraft_version}"
tasks.withType(AbstractArchiveTask).configureEach {
	archiveVersion.set(jarVersion)
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
