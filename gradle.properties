# Gradle properties
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric properties - check https://fabricmc.net/develop/ for updates
# Minecraft ships unobfuscated from 26.1 onward, so there are no mappings to
# configure. Every API this mod uses was checked byte-for-byte identical
# between 26.1.2 and 26.2, so this is the same source as the mc-26.1 branch,
# just pinned to 26.2's dev environment and Fabric API build.
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17.20

# Mod properties
version=1.4.0
group=com.kcb.serverpass

# Dependencies
fabric_api_version=0.159.0+26.2
